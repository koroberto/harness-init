# Lefthook — harness local (pre-commit + pre-push)
# Docs: https://lefthook.dev
# Install: `npm install` na raiz (o script `prepare` roda `lefthook install`).
#
# ADAPTE apenas os blocos de biome/typecheck à estrutura do projeto (em
# monorepo, um bloco por app com `root:`). Os comandos do harness são
# genéricos: escopos e paths vêm do harness.config.json, não daqui.

pre-commit:
  parallel: true
  commands:
    biome:
      glob: '**/*.{ts,tsx,js,mjs,cjs,vue}'
      # Só lint (format é opt-in via `npm run format`) — evita conflito
      # CRLF/LF em repositório com line endings mistos.
      run: npx biome lint --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    harness-checks:
      glob: '**/*.{ts,tsx,js,mjs,cjs,vue,sh,bash,yml,yaml}'
      run: node scripts/harness/check.mjs {staged_files}
    docs-check:
      glob: '**/*.md'
      run: node scripts/harness/docs-check.mjs {staged_files}

pre-push:
  parallel: true
  commands:
    typecheck:
      glob: '**/*.{ts,tsx}'
      run: npm run typecheck
