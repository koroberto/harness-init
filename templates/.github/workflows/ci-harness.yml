name: CI — Harness

# Genérico de propósito: os sensores descobrem sozinhos o que mudou no PR e
# quais arquivos lhes dizem respeito (via harness.config.json). Não há path
# hardcoded aqui — nada para adaptar por projeto.

on:
  pull_request:

jobs:
  harness:
    name: Sensores (arquivos alterados no PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Harness checks
        run: node scripts/harness/check.mjs --changed origin/${{ github.base_ref }}

      - name: Docs check
        run: node scripts/harness/docs-check.mjs --changed origin/${{ github.base_ref }}

  lint:
    name: Biome lint (arquivos alterados no PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Listar arquivos alterados
        id: changed
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMR \
            origin/${{ github.base_ref }}...HEAD \
            | grep -E '\.(ts|tsx|js|mjs|cjs|vue)$' || true)
          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Alterados:"
          echo "$CHANGED"

      - name: Instalar Biome
        if: steps.changed.outputs.files != ''
        run: npm install -g @biomejs/biome@1.9.4

      - name: Lint
        if: steps.changed.outputs.files != ''
        run: |
          echo "${{ steps.changed.outputs.files }}" | while read -r f; do
            if [ -n "$f" ]; then
              biome lint "$f" || exit 1
            fi
          done
