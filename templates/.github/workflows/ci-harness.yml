name: CI — Harness (lint + regex checks)

# ADAPTE: ajuste os paths no `grep` dos jobs abaixo para a estrutura do projeto.
#   - Flat: ^src/.*\.(ts|tsx|js|mjs|vue)$
#   - Monorepo: ^(server|client)/src/.*\.(ts|tsx|js|mjs|vue)$

on:
  pull_request:
    branches: [main]

jobs:
  harness-checks:
    name: Harness regex checks (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run harness on changed files
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD \
            | grep -E '^(server|client|src)/.*\.(ts|tsx|js|mjs|vue)$' \
            || true)
          if [ -z "$CHANGED" ]; then
            echo "No relevant changes — skipping."
            exit 0
          fi
          echo "Checking:"
          echo "$CHANGED"
          echo "$CHANGED" | xargs node scripts/harness-checks.mjs

  lint-changed:
    name: Biome lint (changed files only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: List changed files
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD \
            | grep -E '^(server|client|src)/.*\.(ts|tsx|js|mjs|vue)$' \
            || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Changed files:"
          echo "$CHANGED"
      - name: Install Biome
        if: steps.changed.outputs.files != ''
        run: npm install -g @biomejs/biome@1.9.4
      - name: Lint changed files
        if: steps.changed.outputs.files != ''
        run: |
          echo "${{ steps.changed.outputs.files }}" | while read f; do
            if [ -n "$f" ]; then
              biome lint "$f" || exit 1
            fi
          done
